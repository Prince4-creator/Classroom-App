{% extends 'base.html' %}
{% block title %}Change Password - OneMillionCoders{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-75">
    <div style="max-width: 440px; width: 100%;">
        <div class="app-card p-4">
            <div class="text-center mb-4">
                <h2 class="h4 mb-1">Change Password</h2>
                <p class="small text-muted mb-0">Use at least 8 characters</p>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label class="form-label fw-bold">Current password</label>
                    <input type="password" name="current_password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">New password</label>
                    <input type="password" name="new_password" class="form-control" minlength="8" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Confirm new password</label>
                    <input type="password" name="confirm_password" class="form-control" minlength="8" required>
                </div>
                <div class="d-grid">
                    <button class="btn app-btn">Update Password</button>
                </div>
            </form>
            <div class="mt-3 text-center">
                <a href="javascript:history.back()" class="text-info">Back</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
