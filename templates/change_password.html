{% extends 'base.html' %}
{% block title %}Change Password - OneMillionCoders{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card" style="max-width: 460px;">
        <div class="text-center mb-4">
            <div class="auth-icon mx-auto mb-3"><i class="bi bi-key"></i></div>
            <h2 class="auth-title h4 mb-2">Change Password</h2>
            <p class="small text-muted mb-0">Use at least 8 characters</p>
        </div>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <label class="form-label">Current password</label>
                <input type="password" name="current_password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">New password</label>
                <input type="password" name="new_password" class="form-control" minlength="8" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm new password</label>
                <input type="password" name="confirm_password" class="form-control" minlength="8" required>
            </div>
            <div class="d-grid">
                <button class="btn app-btn btn-lg w-100">Update Password</button>
            </div>
        </form>
        <div class="mt-4 text-center">
            <a href="javascript:history.back()" class="small text-muted text-decoration-none">Back</a>
        </div>
    </div>
</div>
{% endblock %}
