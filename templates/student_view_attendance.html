<!DOCTYPE html>
<html><head><title>Attendance List</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#000;color:#0ff;}</style></head>
<body><nav class="navbar navbar-dark bg-black"><div class="container"><a class="navbar-brand d-flex align-items-center" href="/student/dashboard"><span class="brand-logo"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OneMillionCoders logo"><circle cx="50" cy="50" r="46" fill="#0d172c" stroke="#7c3aed" stroke-width="6"/><path d="M32 40 C20 55, 20 75, 40 80" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/><path d="M50 22 L58 38 L46 36 L42 48" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/><path d="M68 38 C80 55, 80 75, 60 80" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/></svg></span>Attendance List</a><a href="/logout" class="btn btn-outline-danger">Logout</a></div></nav>
<div class="container mt-3"><div class="card bg-dark rounded-4 shadow-lg border-secondary border-1 p-4"><h2 class="h5 text-white mb-3">Attendance for {{ course_code }} on {{ selected_date }}</h2>
<form method="GET" class="row g-2 mb-4"><input type="hidden" name="course" value="{{ course_code }}"><div class="col-auto"><input type="date" name="date" value="{{ selected_date }}" class="form-control"></div><div class="col-auto"><button class="btn btn-info">Change Date</button></div></form>
<div class="table-responsive"><table class="table table-dark table-striped align-middle"><thead><tr><th>Student ID</th><th>Name</th><th>Time</th><th>Status</th></tr></thead><tbody>{% for r in records %}<tr><td>{{ r.student_id }}</td><td>{{ r.name }}</td><td>{{ r.time }}</td><td>{{ r.status }}</td></tr>{% endfor %}</tbody></table></div>
<div class="mt-3"><a href="/student/view_attendance" class="text-info">← Choose another course</a> | <a href="/student/dashboard" class="text-info">Dashboard</a></div></div></div>
</html>
