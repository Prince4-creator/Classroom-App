<!DOCTYPE html>
<html>
<head>
    <title>View Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Attendance Records</span>
        <a href="/" class="btn btn-outline-light">Dashboard</a>
    </div>
</nav>
<div class="container mt-4">
    <h3>Attendance for Date:</h3>
    <form method="GET" action="/view_attendance" class="row g-3 mb-4">
        <div class="col-auto">
            <input type="date" name="date" value="{{ selected_date }}" class="form-control">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">View</button>
        </div>
        <div class="col-auto">
            <a href="/export_attendance?date={{ selected_date }}" class="btn btn-success">Export CSV</a>
        </div>
    </form>
    
    {% if records %}
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Student ID</th><th>Name</th><th>Time</th><th>Status</th><th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for rec in records %}
                <tr>
                    <td>{{ rec.student_id }}</td>
                    <td>{{ rec.name }}</td>
                    <td>{{ rec.time }}</td>
                    <td>
                        <form method="POST" action="/change_status?date={{ selected_date }}" style="display:inline;">
                            <input type="hidden" name="record_id" value="{{ rec.id }}">
                            <select name="status" class="form-select form-select-sm" style="width:auto; display:inline-block;">
                                <option value="present" {% if rec.status=='present' %}selected{% endif %}>Present</option>
                                <option value="absent" {% if rec.status=='absent' %}selected{% endif %}>Absent</option>
                                <option value="late" {% if rec.status=='late' %}selected{% endif %}>Late</option>
                                <option value="excused" {% if rec.status=='excused' %}selected{% endif %}>Excused</option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-outline-primary">Update</button>
                        </form>
                    </td>
                    <td>
                        <!-- Delete not implemented fully; we could add delete endpoint -->
                        <button class="btn btn-sm btn-danger" disabled>Delete</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <div class="alert alert-warning">No attendance records for {{ selected_date }}.</div>
    {% endif %}
</div>
</body>
</html>
