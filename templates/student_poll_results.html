<!DOCTYPE html>
<html><head><title>Poll Results</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#000;color:#0ff;}</style></head>
<body><div class="container mt-4"><div class="card bg-dark"><div class="card-header">{{ question }}</div><ul class="list-group list-group-flush">{% for opt,count in results.items() %}<li class="list-group-item bg-dark text-white">{{ opt }} - {{ count }} votes</li>{% endfor %}</ul></div><a href="/student/poll" class="btn btn-link mt-2">Back to Polls</a></div></body>
</html>
