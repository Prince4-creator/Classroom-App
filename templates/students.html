<!DOCTYPE html>
<html>
<head><title>Manage Students</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
<div class="container mt-4">
    <h2>Student Directory</h2>
    <div class="row">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header">Add New Student</div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-2"><input type="text" name="student_id" class="form-control" placeholder="Student ID" required></div>
                        <div class="mb-2"><input type="text" name="name" class="form-control" placeholder="Full Name" required></div>
                        <button type="submit" class="btn btn-primary">Add</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card">
                <div class="card-header">Current Students</div>
                <ul class="list-group list-group-flush">
                    {% for s in students %}
                        <li class="list-group-item">{{ s.name }} ({{ s.student_id }})</li>
                    {% else %}
                        <li class="list-group-item">No students yet.</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
    <a href="/" class="btn btn-link mt-3">Back</a>
</div>
</body>
</html>
