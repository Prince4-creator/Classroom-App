{% extends 'base.html' %}
{% block title %}Create Poll - OneMillionCoders{% endblock %}
{% block content %}
<div class="d-flex justify-content-center py-4">
    <div class="app-card p-4" style="max-width: 560px; width: 100%;">
        <h1 class="h4 mb-3">Create a Poll</h1>
        <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <label class="form-label">Course</label>
                <select name="course_code" class="form-select" required>
                    {% for c in courses %}
                    <option value="{{ c.code }}">{{ c.code }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Question</label>
                <input type="text" name="question" class="form-control" placeholder="Question" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Options</label>
                <input type="text" name="options" class="form-control" placeholder="Option1, Option2, Option3" required>
            </div>
            <div class="d-grid mb-3">
                <button class="btn app-btn">Activate Poll</button>
            </div>
        </form>
        <div class="text-center">
            <a href="/dashboard">Back</a>
        </div>
    </div>
</div>
{% endblock %}
