<!DOCTYPE html>
<html><head><title>Create Poll</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#000;color:#0ff;}</style></head>
<body><div class="container mt-5"><div class="card bg-dark border-info"><div class="card-header">⚡ NEW POLL ⚡</div>
<form method="POST"><div class="card-body">
    <select name="course_code" class="form-control mb-2" required>{% for c in courses %}<option value="{{ c.code }}">{{ c.code }}</option>{% endfor %}</select>
    <input type="text" name="question" class="form-control mb-2" placeholder="Question" required>
    <input type="text" name="options" class="form-control mb-2" placeholder="Option1, Option2, Option3" required>
    <button class="btn btn-info">ACTIVATE POLL</button>
</div></form></div><a href="/dashboard">Back</a></div></body>
</html>
