{% extends 'base.html' %}
{% block title %}OneMillionCoders Class{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card text-center" style="max-width: 520px;">
        <img src="https://cdn.onemillioncoders.gov.gh/omcp-asset/images/one-million-coders-logo.png" alt="OneMillionCoders logo" class="auth-logo mb-4">
        <h1 class="auth-title h2 mb-2">OneMillionCoders Class</h1>
        <p class="text-muted mb-4">Manage attendance, polls and announcements.</p>
        <div class="d-grid">
            <a href="/student/login" class="btn app-btn btn-lg w-100">Student Login</a>
        </div>
        <div class="mt-4">
            <a href="/student/register" class="fw-semibold text-decoration-none" style="color: var(--accent);">New student? Register here</a>
        </div>
    </div>
</div>
{% endblock %}
