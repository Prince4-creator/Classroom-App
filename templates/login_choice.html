<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>OneMillionCoders Class</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body{background: radial-gradient(circle at top left, rgba(34,211,238,.18), transparent 18%), radial-gradient(circle at bottom right, rgba(124,58,237,.18), transparent 24%), #030514;color:#edf4ff;font-family:Inter, system-ui, sans-serif}
		.welcome-card{max-width:900px;margin:auto;border-radius:24px;padding:40px;background:linear-gradient(180deg, rgba(7,16,45,.96), rgba(5,10,34,.94));box-shadow:0 24px 60px rgba(0,0,0,.32);border:1px solid rgba(124,58,237,.18)}
		.btn-lg.w-100{padding:18px}
		.welcome-card h1{letter-spacing:1px;text-shadow:0 2px 18px rgba(124,58,237,.28);}
		.welcome-card p{color:#b9d2f5;}
	</style>
</head>
<body class="d-flex align-items-center min-vh-100">
	<div class="container">
		<div class="welcome-card text-center">
			<img src="https://cdn.onemillioncoders.gov.gh/omcp-asset/images/one-million-coders-logo.png" alt="OneMillionCoders logo" style="width:120px;height:120px;object-fit:cover;border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.25);" class="mb-4">
			<h1 class="mb-4" style="font-weight:600;color:#22d3ee">OneMillionCoders Class</h1>
			<p class="text-muted mb-4">Manage attendance, polls and announcements.</p>
			<div class="row g-3 justify-content-center">
				<div class="col-12 col-md-5">
					<a href="/student/login" class="btn btn-info btn-lg w-100">Student Login</a>
				</div>
				<div class="col-12 col-md-5">
					<a href="/admin/login" class="btn btn-warning btn-lg w-100">Admin Login</a>
				</div>
			</div>
			<div class="mt-4">
				<a href="/student/register" class="text-decoration-none" style="color:#7dd3fc">New student? Register here</a>
			</div>
		</div>
	</div>
</body>
</html>
