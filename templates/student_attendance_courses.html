{% extends 'base.html' %}
{% block title %}Select Course - OneMillionCoders{% endblock %}
{% block content %}
<div class="row justify-content-center py-2">
    <div class="col-xl-8">
        <div class="app-card p-4">
            <h1 class="h5 mb-3">Select a course to see attendance</h1>
            <div class="list-group">
                {% for c in courses %}
                <a href="/student/view_attendance?course={{ c.code }}" class="list-group-item list-group-item-action rounded-3 mb-2">{{ c.code }} — {{ c.name }}</a>
                {% endfor %}
            </div>
            <div class="mt-4">
                <a href="/student/dashboard">Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
