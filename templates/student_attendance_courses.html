<!DOCTYPE html>
<html><head><title>Select Course</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#000;color:#0ff;}</style></head>
<body><nav class="navbar navbar-dark bg-black"><div class="container"><a class="navbar-brand d-flex align-items-center" href="/student/dashboard"><span class="brand-logo"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OneMillionCoders logo"><circle cx="50" cy="50" r="46" fill="#0d172c" stroke="#7c3aed" stroke-width="6"/><path d="M32 40 C20 55, 20 75, 40 80" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/><path d="M50 22 L58 38 L46 36 L42 48" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/><path d="M68 38 C80 55, 80 75, 60 80" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/></svg></span>Attendance Courses</a><a href="/logout" class="btn btn-outline-danger">Logout</a></div></nav>
<div class="container mt-5"><div class="card bg-dark rounded-4 shadow-lg border-secondary border-1 p-4"><h3 class="mb-4">Select a course to see attendance</h3><ul class="list-group">{% for c in courses %}<a href="/student/view_attendance?course={{ c.code }}" class="list-group-item list-group-item-action bg-dark text-info">{{ c.code }} - {{ c.name }}</a>{% endfor %}</ul><div class="mt-4"><a href="/student/dashboard" class="text-info">Back to Dashboard</a></div></div></div>
</html>
