<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OneMillionCoders Classroom Hub{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-start: #08101f;
            --bg-end: #0e1f43;
            --panel: rgba(14, 24, 49, 0.88);
            --text: #e5f7ff;
            --muted: #9bb9d8;
            --accent: #7c3aed;
            --accent-2: #22d3ee;
            --border: rgba(255,255,255,.12);
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top left, rgba(34,211,238,.16), transparent 25%),
                        radial-gradient(circle at bottom right, rgba(124,58,237,.16), transparent 28%),
                        linear-gradient(180deg, var(--bg-start) 0%, #08101f 42%, var(--bg-end) 100%);
        }
        nav.navbar {
            background: rgba(5, 10, 23, 0.92);
            border-bottom: 1px solid rgba(255,255,255,.08);
            backdrop-filter: blur(14px);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
        }
        .brand-logo {
            height: 36px;
            width: 36px;
            margin-right: 0.8rem;
            border-radius: 0.45rem;
            box-shadow: 0 0 18px rgba(124, 58, 237, 0.25);
            flex-shrink: 0;
        }
        .brand-logo svg, .brand-logo img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .app-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 1.15rem;
            box-shadow: 0 18px 45px rgba(0,0,0,.22);
        }
        .app-card .card-header {
            background: transparent;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .app-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff !important;
            font-weight: 700;
            border: none;
            box-shadow: 0 16px 30px rgba(34,211,238,.24);
            transition: transform 0.2s ease, opacity 0.2s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,.22);
        }
        .app-btn:hover {
            opacity: .96;
            transform: translateY(-1px);
        }
        .badge-soft {
            background: rgba(34,211,238,.12);
            color: var(--text);
        }
        .list-group-item {
            background: rgba(255,255,255,.03);
            border-color: rgba(255,255,255,.08);
            color: var(--text);
        }
        .form-control, .form-select {
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.12);
            color: var(--text);
        }
        .form-control:focus, .form-select:focus {
            border-color: rgba(124,58,237,.75);
            box-shadow: 0 0 0 0.15rem rgba(124,58,237,.15);
        }
        /* Make select dropdown options vivid and readable across browsers */
        .form-select option {
            color: var(--text);
            background: rgba(0,0,0,0.92);
        }
        .form-select optgroup {
            color: var(--muted);
            background: rgba(0,0,0,0.92);
        }
        a, .text-info { color: #7c3aed !important; }
        .badge-announcement {
            background: rgba(34,211,238,.18);
            color: #22d3ee;
            border: 1px solid rgba(34,211,238,.35);
        }
        .badge-assignment {
            background: rgba(251,191,36,.18);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,.35);
        }
        .badge-exercise {
            background: rgba(236,72,153,.18);
            color: #ec4899;
            border: 1px solid rgba(236,72,153,.35);
        }
        .announcement-card { border-color: rgba(34,211,238,.18); }
        .assignment-card { border-color: rgba(251,191,36,.18); }
        .exercise-card { border-color: rgba(236,72,153,.18); }
        footer { color: var(--muted); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <span class="brand-logo">
                <img src="https://onemillioncoders.gov.gh/_next/image?url=https%3A%2F%2Fcdn.onemillioncoders.gov.gh%2Fomcp-asset%2Fimages%2Fone-million-coders-logo.png&w=128&q=75" alt="OneMillionCoders logo" class="brand-img">
            </span>
            OneMillionCoders Classroom Hub
        </a>
        {% if session.user %}
        <div class="d-flex align-items-center gap-3 ms-auto text-white">
            <span class="small">{{ session.user|capitalize }} • {{ session.role|capitalize }}</span>
            <a href="/logout" class="btn btn-sm app-btn">Logout</a>
        </div>
        {% endif %}
    </div>
</nav>
<main class="container py-4">
    {% block content %}{% endblock %}
</main>
<footer class="container text-center pb-4">
    <span class="small">Attendance system • built for classroom use</span>
</footer>
</body>
</html>
