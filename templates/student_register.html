{% extends 'base.html' %}
{% block title %}Student Registration - OneMillionCoders{% endblock %}
{% block content %}
<div class="d-flex justify-content-center py-4">
    <div class="app-card p-4" style="max-width: 500px; width: 100%;">
        <h1 class="h4 mb-3">Student Registration</h1>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Student ID</label>
                <input type="text" name="student_id" class="form-control" placeholder="Student ID" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Full name</label>
                <input type="text" name="name" class="form-control" placeholder="Full Name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" name="email" class="form-control" placeholder="student@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Course</label>
                <select name="class_code" class="form-select">
                    <option value="">Select Course</option>
                    {% for c in courses %}
                    <option value="{{ c.code }}">{{ c.code }} - {{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="d-grid mb-3">
                <button class="btn app-btn">Register</button>
            </div>
        </form>
        <div class="text-center">
            <a href="/student/login">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
