<!DOCTYPE html>
<html><head><title>Student Register</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#000;color:#0ff;}</style></head>
<body><div class="container mt-5" style="max-width:500px;"><div class="card bg-dark text-white"><div class="card-header"><h3>Student Registration</h3></div><div class="card-body">
<form method="POST"><input type="text" name="student_id" class="form-control mb-2" placeholder="Student ID" required><input type="text" name="name" class="form-control mb-2" placeholder="Full Name" required><input type="email" name="email" class="form-control mb-2" placeholder="Email address" required><input type="password" name="password" class="form-control mb-2" placeholder="Password" required><select name="class_code" class="form-control mb-2"><option value="">Select Course</option>{% for c in courses %}<option value="{{ c.code }}">{{ c.code }} - {{ c.name }}</option>{% endfor %}</select><button class="btn btn-info w-100">Register</button></form>
<a href="/student/login">Back to Login</a>
</div></div></div></body>
</html>
