{% extends 'base.html' %}
{% block title %}Student Registration - OneMillionCoders{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card" style="max-width: 520px;">
        <div class="text-center mb-4">
            <img src="https://cdn.onemillioncoders.gov.gh/omcp-asset/images/one-million-coders-logo.png" alt="OneMillionCoders logo" class="auth-logo mb-3">
            <h1 class="auth-title h3 mb-2">Student Registration</h1>
            <p class="small text-muted mb-0">Create your account to join the class</p>
        </div>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <label class="form-label">Student ID</label>
                <input type="text" name="student_id" class="form-control" placeholder="Student ID" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Full name</label>
                <input type="text" name="name" class="form-control" placeholder="Full Name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" name="email" class="form-control" placeholder="student@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Course</label>
                <select name="class_code" class="form-select">
                    <option value="">Select Course</option>
                    {% for c in courses %}
                    <option value="{{ c.code }}">{{ c.code }} - {{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="d-grid mb-3">
                <button class="btn app-btn btn-lg w-100">Register</button>
            </div>
        </form>
        <div class="text-center">
            <a href="/student/login" class="fw-semibold text-decoration-none" style="color: var(--accent);">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
