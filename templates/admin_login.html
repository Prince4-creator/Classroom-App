{% extends 'base.html' %}

{% block title %}Admin Login - OneMillionCoders{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card" style="max-width: 440px;">
        <div class="text-center mb-4">
            <div class="auth-icon mx-auto mb-3"><i class="bi bi-shield-lock"></i></div>
            <h2 class="auth-title h3 mb-2">Admin / Instructor Login</h2>
            <p class="small text-muted mb-0">Sign in to administer classes and announcements</p>
        </div>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <div class="d-grid">
                <button class="btn app-btn btn-lg w-100">Login</button>
            </div>
        </form>
        <div class="mt-4 text-center">
            <a href="/" class="small text-muted text-decoration-none">Back to home</a>
        </div>
    </div>
</div>
{% endblock %}
