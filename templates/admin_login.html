{% extends 'base.html' %}

{% block title %}Admin Login - OneMillionCoders{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-75">
    <div style="max-width: 420px; width: 100%;">
        <div class="app-card p-4 border border-white border-opacity-10">
            <div class="text-center mb-4">
                <img src="https://onemillioncoders.gov.gh/_next/image?url=https%3A%2F%2Fcdn.onemillioncoders.gov.gh%2Fomcp-asset%2Fimages%2Fone-million-coders-logo.png&w=128&q=75" alt="OneMillionCoders logo" style="width:82px;height:82px;object-fit:cover;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.2);" class="mb-3">
                <h2 class="h3 mb-2" style="color: #e5f7ff; text-shadow: 0 0 14px rgba(124,58,237,.45);">Admin / Instructor Login</h2>
                <p class="small text-muted">Sign in to administer classes and announcements</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-white fw-bold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-white fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <div class="d-grid">
                    <button class="btn btn-warning">Login</button>
                </div>
            </form>
            <div class="mt-3 text-center">
                <a href="/" class="text-info">Back to home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
