{% extends 'base.html' %}

{% block title %}Admin Login - OneMillionCoders{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-75">
    <div style="max-width: 420px; width: 100%;">
        <div class="app-card p-4">
            <div class="text-center mb-4">
                <img src="https://cdn.onemillioncoders.gov.gh/omcp-asset/images/one-million-coders-logo.png" alt="OneMillionCoders logo" style="width:82px;height:82px;object-fit:cover;border-radius:16px;box-shadow:0 6px 16px rgba(15,23,42,.12);" class="mb-3">
                <h2 class="h3 mb-2">Admin / Instructor Login</h2>
                <p class="small text-muted">Sign in to administer classes and announcements</p>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label class="form-label fw-bold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <div class="d-grid">
                    <button class="btn app-btn">Login</button>
                </div>
            </form>
            <div class="mt-3 text-center">
                <a href="/" class="text-info">Back to home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
