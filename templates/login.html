{% extends 'base.html' %}
{% block title %}Login - OneMillionCoders Classroom Hub{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-6 col-lg-4">
        <div class="app-card p-4">
            <img src="https://cdn.onemillioncoders.gov.gh/omcp-asset/images/one-million-coders-logo.png" alt="OneMillionCoders logo" style="width:80px;height:80px;object-fit:cover;border-radius:16px;box-shadow:0 6px 16px rgba(15,23,42,.12);" class="mb-3">
            <h1 class="h3 mb-3">Welcome Back</h1>
            <p class="text-muted mb-4">Sign in to manage attendance, polls and announcements.</p>
            <form method="POST" class="mb-3">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <button class="btn app-btn w-100">Sign In</button>
            </form>
            <div class="text-center text-muted small">Use admin/admin123 for the first login.</div>
            <div class="text-center mt-3"><a href="/student/login" class="text-info">Student login</a></div>
        </div>
    </div>
</div>
{% endblock %}
