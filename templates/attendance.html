{% extends 'base.html' %}
{% block title %}Mark Attendance - OneMillionCoders Classroom Hub{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-5 col-lg-6">
        <div class="app-card p-4">
            <h2 class="h4 mb-3">Mark Attendance</h2>
            <p class="text-muted mb-4">Enter student ID and select the course to mark attendance manually.</p>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label class="form-label">Student ID</label>
                    <input type="text" name="student_id" class="form-control" placeholder="Enter student ID" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Course</label>
                    <select name="course_code" class="form-select" required>
                        <option value="">Select course</option>
                        {% for c in courses %}
                        <option value="{{ c.code }}">{{ c.code }} - {{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button class="btn app-btn w-100">Mark Present</button>
            </form>
            <div class="mt-4 text-center">
                <a href="/attendance/checkin" class="text-info">Use token/QR check-in instead</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
