{% extends 'base.html' %}
{% block title %}Poll Results - OneMillionCoders{% endblock %}
{% block content %}
<div class="row justify-content-center py-2">
    <div class="col-xl-8">
        <div class="app-card p-4">
            <h1 class="h5 mb-3">{{ question }}</h1>
            <ul class="list-group list-group-flush">
                {% for opt, count in results.items() %}
                <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                    {{ opt }}
                    <span class="badge rounded-pill badge-soft">{{ count }} votes</span>
                </li>
                {% else %}
                <li class="list-group-item px-0 text-muted">No votes yet.</li>
                {% endfor %}
            </ul>
            <div class="mt-3">
                <a href="/poll">Back to Polls</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
