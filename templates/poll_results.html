<!DOCTYPE html>
<html><head><title>Results</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#000;color:#0ff;}</style></head>
<body><div class="container mt-4"><div class="card bg-dark text-white"><div class="card-header"><h3>📊 {{ question }}</h3></div>
<ul class="list-group list-group-flush">{% for opt,count in results.items() %}<li class="list-group-item bg-dark text-white">{{ opt }} <span class="badge bg-info">{{ count }} votes</span></li>{% else %}<li>No votes</li>{% endfor %}</ul>
<a href="/poll" class="btn btn-link mt-3">Back to Polls</a></div></div></body>
</html>
