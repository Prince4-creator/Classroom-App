<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - OneMillionCoders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-start: #030514;
            --bg-end: #081424;
            --panel: rgba(10, 16, 34, 0.88);
            --text: #edf4ff;
            --muted: #9bb9d8;
            --accent: #7c3aed;
            --accent-2: #22d3ee;
            --accent-3: #f59e0b;
            --border: rgba(124, 58, 237, .20);
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top left, rgba(34,211,238,.16), transparent 25%),
                        radial-gradient(circle at bottom right, rgba(124,58,237,.16), transparent 28%),
                        linear-gradient(180deg, var(--bg-start) 0%, #08101f 42%, var(--bg-end) 100%);
        }
        nav.navbar {
            background: rgba(4, 8, 24, 0.92);
            border-bottom: 1px solid rgba(124, 58, 237, .16);
            backdrop-filter: blur(16px);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
        }
        .brand-logo {
            height: 36px;
            width: 36px;
            margin-right: 0.8rem;
            border-radius: 0.45rem;
            box-shadow: 0 0 18px rgba(124, 58, 237, 0.25);
            flex-shrink: 0;
        }
        .brand-logo svg, .brand-logo img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .app-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 1.15rem;
            box-shadow: 0 18px 45px rgba(0,0,0,.22);
        }
        .app-card .card-header {
            background: transparent;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .app-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff !important;
            font-weight: 700;
            border: none;
            box-shadow: 0 16px 40px rgba(34,211,238,.24);
            transition: transform 0.2s ease, opacity 0.2s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,.24);
        }
        .app-btn:hover {
            opacity: .96;
            transform: translateY(-1px);
        }
        .badge-soft {
            background: rgba(34,211,238,.12);
            color: var(--text);
        }
        .list-group-item {
            background: rgba(255,255,255,.03);
            border-color: rgba(255,255,255,.08);
            color: var(--text);
        }
        .form-control, .form-select {
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.12);
            color: var(--text);
        }
        .form-control:focus, .form-select:focus {
            border-color: rgba(124,58,237,.75);
            box-shadow: 0 0 0 0.15rem rgba(124,58,237,.15);
        }
        /* Make select dropdown options vivid and readable across browsers */
        .form-select option {
            color: var(--text);
            background: rgba(0,0,0,0.92);
        }
        .form-select optgroup {
            color: var(--muted);
            background: rgba(0,0,0,0.92);
        }
        a, .text-info { color: #7c3aed !important; }
        .badge-announcement {
            background: rgba(34,211,238,.18);
            color: #22d3ee;
            border: 1px solid rgba(34,211,238,.35);
        }
        .badge-assignment {
            background: rgba(251,191,36,.18);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,.35);
        }
        .badge-exercise {
            background: rgba(236,72,153,.18);
            color: #ec4899;
            border: 1px solid rgba(236,72,153,.35);
        }
        .announcement-card { border-color: rgba(34,211,238,.18); }
        .assignment-card { border-color: rgba(251,191,36,.18); }
        .exercise-card { border-color: rgba(236,72,153,.18); }
        footer { color: var(--muted); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <span class="brand-logo">
                <img src="https://cdn.onemillioncoders.gov.gh/omcp-asset/images/one-million-coders-logo.png" alt="OneMillionCoders logo" class="brand-img">
            </span>
            OneMillionCoders Classroom Hub
        </a>
        
    </div>
</nav>
<main class="container py-4">
        
        
            
        

        
<div class="d-flex justify-content-center align-items-center min-vh-75">
    <div style="max-width: 420px; width: 100%;">
        <div class="app-card p-4 border border-white border-opacity-10">
            <div class="text-center mb-4">
                <img src="https://cdn.onemillioncoders.gov.gh/omcp-asset/images/one-million-coders-logo.png" alt="OneMillionCoders logo" style="width:82px;height:82px;object-fit:cover;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.2);" class="mb-3">
                <h2 class="h3 mb-2" style="color: #e5f7ff; text-shadow: 0 0 14px rgba(124,58,237,.45);">Admin / Instructor Login</h2>
                <p class="small text-muted">Sign in to administer classes and announcements</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-white fw-bold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-white fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <div class="d-grid">
                    <button class="btn btn-warning">Login</button>
                </div>
            </form>
            <div class="mt-3 text-center">
                <a href="/" class="text-info">Back to home</a>
            </div>
        </div>
    </div>
</div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<footer class="container text-center pb-4">
    <span class="small">Attendance system • built for classroom use</span>
</footer>
</body>
</html>
