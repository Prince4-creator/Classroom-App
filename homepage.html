<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>OneMillionCoders Class</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body{background:#0f1724;color:#e6f7ff;font-family:Inter, system-ui, sans-serif}
		.welcome-card{max-width:900px;margin:auto;border-radius:12px;padding:36px;background:linear-gradient(180deg,#071423, #081424);box-shadow:0 8px 24px rgba(2,6,23,.6);border:1px solid rgba(34,211,238,.06)}
		.btn-lg.w-100{padding:18px}
	</style>
</head>
<body class="d-flex align-items-center min-vh-100">
	<div class="container">
		<div class="welcome-card text-center">
			<h1 class="mb-4" style="font-weight:600;color:#22d3ee">OneMillionCoders Class</h1>

			<div class="row g-3 justify-content-center">
				<div class="col-12 col-md-5">
					<a href="/student/login" class="btn btn-info btn-lg w-100">Student Login</a>
				</div>
				<div class="col-12 col-md-5">
					<a href="/admin/login" class="btn btn-warning btn-lg w-100">Admin Login</a>
				</div>
			</div>
			<div class="mt-4">
				<a href="/student/register" class="text-decoration-none" style="color:#7dd3fc">New student? Register here</a>
			</div>
		</div>
	</div>

</html>
